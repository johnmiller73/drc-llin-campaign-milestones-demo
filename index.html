<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des jalons des campagnes MILD GC8 – RDC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --path-grey:#464F60; --path-red:#F65050; --ink:#464F60; --ink-muted:#6B7385;
    --surface:#FFFFFF; --surface-soft:#EBEDEE; --line:#D5D8DD;
    --done:#2E7D4F; --progress:#2F6FB0; --late:#D93A3A; --notstarted:#8A919C;
    --font:"NB International Pro","Inter",Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--ink);background:var(--surface);font-size:15px;line-height:1.45}
  header{display:flex;align-items:center;gap:24px;padding:20px 40px;border-bottom:1px solid var(--line)}
  header img{height:40px;width:auto}
  header h1{font-size:24px;line-height:30px;margin:0;font-weight:700}
  header p{margin:2px 0 0;color:var(--ink-muted);font-size:13px}
  .langswitch{margin-left:auto;display:inline-flex;border:1px solid var(--path-grey);border-radius:4px;overflow:hidden;flex:none}
  .langswitch button{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border:0;background:#fff;color:var(--ink);cursor:pointer}
  .langswitch button+button{border-left:1px solid var(--path-grey)}
  .langswitch button[aria-pressed="true"]{background:var(--path-grey);color:#fff}
  .langswitch button:focus-visible{outline:2px solid var(--path-red);outline-offset:-2px}
  .demo{display:flex;gap:12px;align-items:center;background:var(--path-grey);color:#fff;padding:10px 40px;font-size:14px}
  .demo strong{background:var(--path-red);color:#fff;padding:3px 10px;border-radius:4px;letter-spacing:.06em;font-size:12px;white-space:nowrap}
  .demo.real strong{background:#fff;color:var(--path-grey)}
  main{padding:24px 40px 48px;max-width:1440px}
  .filters{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:24px}
  .filters label{display:flex;flex-direction:column;font-size:12px;color:var(--ink-muted);gap:4px}
  select{font:inherit;font-size:14px;color:var(--ink);padding:7px 10px;border:1px solid #8A919C;border-radius:4px;background:#fff;min-width:190px}
  button.reset{font:inherit;font-size:14px;padding:7px 14px;border:1px solid var(--path-grey);background:#fff;color:var(--ink);border-radius:4px;cursor:pointer}
  button.reset:hover{background:var(--surface-soft)}
  .asof{margin-left:auto;font-size:13px;color:var(--ink-muted)}
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:16px;margin-bottom:32px}
  .kpi{background:var(--surface-soft);padding:16px}
  .kpi .v{font-size:36px;line-height:42px;font-weight:700}
  .kpi .l{font-size:13px}
  .kpi .s{font-size:12px;color:var(--ink);opacity:.85}
  .kpi.late .v{color:var(--late)}
  section{margin-bottom:40px}
  h2{font-size:18px;line-height:24px;margin:0 0 4px}
  .sub{font-size:13px;color:var(--ink-muted);margin:0 0 12px}
  .legend{display:flex;flex-wrap:wrap;gap:18px;font-size:13px;margin:0 0 8px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .chart{position:relative;width:100%}
  svg text{font-family:var(--font)}
  .tip{position:fixed;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(70,79,96,.18);padding:10px 12px;font-size:13px;max-width:320px;display:none;z-index:10}
  .tip b{display:block;margin-bottom:2px}
  .tip .m{color:var(--ink-muted)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th{text-align:left;font-weight:600;background:var(--surface-soft);padding:8px 10px;position:sticky;top:0;cursor:pointer;white-space:nowrap}
  th[aria-sort="ascending"]::after{content:" ▲";font-size:10px}
  th[aria-sort="descending"]::after{content:" ▼";font-size:10px}
  td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;border:1px solid}
  .pill.Done{color:#1F5C39;border-color:var(--done);background:#E6F2EA}
  .pill.In{color:#1E4F82;border-color:var(--progress);background:#E7EFF8}
  .pill.Late{color:#A12424;border-color:var(--late);background:#FCE9E9}
  .pill.Not{color:var(--ink);border-color:var(--notstarted);background:#fff}
  .tablewrap{max-height:520px;overflow:auto;border:1px solid var(--line)}
  .ctx{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .card{border:1px solid var(--line);padding:12px 14px;font-size:13px}
  .card h3{margin:0 0 2px;font-size:15px}
  .card .r{color:var(--ink-muted);margin-bottom:6px}
  .card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
  .card dt{color:var(--ink-muted)} .card dd{margin:0;font-variant-numeric:tabular-nums}
  footer{border-top:1px solid var(--line);padding:16px 40px 32px;font-size:12px;color:var(--ink-muted)}
  footer p{margin:4px 0}
  @media (max-width:900px){header,main,footer,.demo{padding-left:16px;padding-right:16px}header{flex-wrap:wrap}.kpis{grid-template-columns:repeat(2,1fr)}.asof{margin-left:0}}
</style>
</head>
<body>
<header>
  <img src="assets/path-logo-primary-color.svg" alt="PATH">
  <div>
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </div>
  <div class="langswitch" role="group" aria-label="Langue / Language">
    <button type="button" data-lang="fr" lang="fr">FR</button>
    <button type="button" data-lang="en" lang="en">EN</button>
  </div>
</header>
<div class="demo" role="note" id="banner">

  <span id="bannerText"></span>
</div>

<main>

      <select id="fProvince"></select></label>
    <label><span data-i18n="fStage"></span>
      <select id="fStage"></select></label>
    <label><span data-i18n="fStatus"></span>
      <select id="fStatus"></select></label>
    <button class="reset" id="reset" type="button" data-i18n="clear"></button>
    <div class="asof"><span data-i18n="asof"></span> <b id="asofLabel"></b> <span id="asofNote"></span></div>
  </div>

  <div class="kpis" id="kpis"></div>

  <section>
    <h2 data-i18n="hTimeline"></h2>
    <p class="sub" data-i18n="subTimeline"></p>
    <div class="legend" id="legend"></div>
    <div class="chart" id="timeline"></div>
  </section>

  <section>
    <h2 data-i18n="hBars"></h2>
    <p class="sub" data-i18n="subBars"></p>
    <div class="chart" id="bars"></div>
  </section>

  <section>
    <h2 data-i18n="hCtx"></h2>
    <p class="sub" data-i18n="subCtx"></p>
    <div class="ctx" id="ctx"></div>
  </section>

  <section>

    <p class="sub" id="tableCount"></p>
    <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  </section>
</main>

<footer>

  <p data-i18n-html="footTiming"></p>
  <p data-i18n-html="footRegions"></p>

</footer>

<div class="tip" id="tip"></div>

// language: ?lang=en|fr, then the visitor's last choice, then the default
let LANG = (()=>{
  const q=new URLSearchParams(location.search).get("lang");
  if(q==="fr"||q==="en") return q;
  try{ const s=localStorage.getItem("macepa-dash-lang"); if(s==="fr"||s==="en") return s; }catch(e){}
  return DEFAULT_LANG;
})();
const t=k=>T[LANG][k];
const loc=()=>LANG==="fr"?"fr-FR":"en-GB";
const fmt=d=>d.toLocaleDateString(loc(),{day:"numeric",month:"short",year:"numeric"});
const num=(v,dp=1)=>v.toLocaleString(loc(),{minimumFractionDigits:dp,maximumFractionDigits:dp});
const pct=v=>LANG==="fr"?`${num(v)} %`:`${num(v)}%`;

/* ============ LOGIC ============ */
const STATUS = [
  {k:"Done",        lk:"sDone", cls:"Done", hex:"#2E7D4F", icon:"✓"},
  {k:"In progress", lk:"sProg", cls:"In",   hex:"#2F6FB0", icon:"◐"},
  {k:"Late",        lk:"sLate", cls:"Late", hex:"#D93A3A", icon:"!"},
  {k:"Not started", lk:"sNot",  cls:"Not",  hex:"#8A919C", icon:"○"}
];
const S = Object.fromEntries(STATUS.map(s=>[s.k,s]));
const DAY = 864e5;
let asof = new Date(AS_OF+"T00:00:00");
const addDays = (iso,n) => new Date(new Date(iso+"T00:00:00").getTime()+n*DAY);
const MID = Object.fromEntries(MILESTONES.map(m=>[m.id,m]));

// display helpers: names come from the template by id, in the current language
const stageLabel = k => (STAGE_LABELS[k]||{})[LANG] || k;
const msName = r => MID[r.id] ? MID[r.id].name[LANG] : (r.rawName||`#${r.id}`);
const msDone = r => MID[r.id] ? MID[r.id].done[LANG] : "";

function demoStatus(p,m,due){
  if (DEMO_LATE.has(p.name+"|"+m.id)) return "Late";
  const days=(due-asof)/DAY;
  if (days < 0) return "Done";
  if (days <= 60) return "In progress";
  return "Not started";
}

let ROWS = [], SOURCE = "demo", META = "";
function buildDemo(){
  ROWS=[];
  PROVINCES.forEach(p=>MILESTONES.forEach(m=>{
    const due=addDays(p.dist,m.offset);
    ROWS.push({province:p.name, region:p.region, stage:m.stage, id:m.id, due, offset:m.offset, status:demoStatus(p,m,due), actual:null, notes:""});
  }));
}

// ---------- real data: CSV exported from the update sheet ----------
function parseCSV(text){
  const out=[];let row=[],f="",q=false;
  text=text.replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f="";}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(f);f=""; if(row.some(v=>v.trim()!==""))out.push(row); row=[]; }
    else f+=c;}
  row.push(f); if(row.some(v=>v.trim()!==""))out.push(row);
  return out;
}
const MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
function parseDate(v){
  v=(v||"").trim(); if(!v) return null;
  let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return new Date(+m[1],m[2]-1,+m[3]);
  m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m) return new Date(+m[3],m[1]-1,+m[2]);   // m/d/yyyy (US export)
  m=v.match(/^(\d{1,2})[ -]([A-Za-z]{3,4})[a-z]*[ -](\d{4})$/); if(m&&MONTHS[m[2].toLowerCase()]!=null) return new Date(+m[3],MONTHS[m[2].toLowerCase()],+m[1]);
  if(/^\d{5}(\.\d+)?$/.test(v)) return new Date(Math.round((+v-25569)*DAY)+new Date().getTimezoneOffset()*6e4); // spreadsheet serial
  const d=new Date(v); return isNaN(d)?null:d;
}
function rowsFromCSV(text){
  const tb=parseCSV(text); if(tb.length<2) throw new Error("empty");
  const h=tb[0].map(x=>x.trim().toLowerCase());
  const col=n=>h.indexOf(n.toLowerCase());
  ["Province","Milestone ID","Status"].forEach(n=>{if(col(n)<0) throw new Error("missing column "+n);});
  const get=(r,n)=>{const i=col(n);return i<0?"":(r[i]||"").trim();};
  const today=new Date(); today.setHours(0,0,0,0); asof=today;
  const out=[];
  tb.slice(1).forEach(r=>{
    const prov=get(r,"Province"), id=parseInt(get(r,"Milestone ID"),10); if(!prov||!id) return;
    const m=MID[id]||{id,stage:get(r,"Stage"),offset:0};
    const p=PROVINCES.find(x=>x.name===prov);
    let due=parseDate(get(r,"Planned due date"));
    if(!due&&p) due=addDays(p.dist,m.offset);
    if(!due) return;
    let st=get(r,"Status"); if(!["Done","In progress","Not started"].includes(st)) st="Not started";
    if(st!=="Done"&&due<today) st="Late";
    out.push({province:prov, region:get(r,"Region")||(p?p.region:""), stage:m.stage||get(r,"Stage"), id, rawName:get(r,"Milestone"),
      due, offset:p?Math.round((due-new Date(p.dist+"T00:00:00"))/DAY):m.offset, status:st,
      actual:parseDate(get(r,"Actual completion date")), notes:get(r,"Notes")});
  });
  if(!out.length) throw new Error("no rows");
  out.filter(r=>r.id===12).forEach(r=>{const p=PROVINCES.find(x=>x.name===r.province);
    if(p) p.dist=`${r.due.getFullYear()}-${String(r.due.getMonth()+1).padStart(2,"0")}-${String(r.due.getDate()).padStart(2,"0")}`;});
  [...new Set(out.map(r=>r.province))].forEach(n=>{ if(!PROVINCES.find(p=>p.name===n)){const r=out.find(x=>x.province===n&&x.id===12)||out.find(x=>x.province===n);
    PROVINCES.push({name:n,region:r.region,dist:null,_due:r.due});}});
  out.forEach(r=>{const p=PROVINCES.find(x=>x.name===r.province); if(p&&r.region) p.region=r.region;});
  PROVINCES.sort((a,b)=>(a.dist?new Date(a.dist):a._due)-(b.dist?new Date(b.dist):b._due));
  return out;
}

// ---------- page text ----------
const el=id=>document.getElementById(id);
function applyStatic(){
  document.documentElement.lang=LANG;
  document.title=t("htmlTitle")+(SOURCE==="demo"?(LANG==="fr"?" (données de démonstration)":" (demonstration data)"):"");
  document.querySelectorAll("[data-i18n]").forEach(n=>n.textContent=t(n.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(n=>n.innerHTML=t(n.dataset.i18nHtml));
  document.querySelectorAll(".langswitch button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG?"true":"false"));
  const real=SOURCE==="sheet";
  el("banner").classList.toggle("real",real);
  el("bannerTag").textContent=real?t("realTag"):t("demoTag");
  el("bannerText").innerHTML=real?t("realText")(DATA_FILE,META?fmt(META):""):t("demoText");
  el("footData").textContent=real?t("footReal"):t("footDemo");
  el("asofLabel").textContent=fmt(asof);
  el("asofNote").textContent=real?"":t("demoNote");
  el("legend").innerHTML=STATUS.map(s=>`<span><svg width="14" height="14" aria-hidden="true">${s.k==="Not started"?`<circle cx="7" cy="7" r="5" fill="#fff" stroke="${s.hex}" stroke-width="2"/>`:`<circle cx="7" cy="7" r="6" fill="${s.hex}"/>`}</svg>${t(s.lk)}</span>`).join("")+
    `<span><svg width="14" height="14" aria-hidden="true"><path d="M7 1 L13 7 L7 13 L1 7Z" fill="#464F60"/></svg>${t("lgDist")}</span>`+
    `<span><svg width="14" height="14" aria-hidden="true"><line x1="7" y1="0" x2="7" y2="14" stroke="#F65050" stroke-width="2"/></svg>${t("lgAsof")}</span>`;
}

// ---------- filters ----------
function fill(sel,opts,all){ const cur=sel.value; sel.innerHTML=`<option value="">${all}</option>`+opts.map(([v,l])=>`<option value="${v}">${l}</option>`).join(""); if(opts.some(o=>o[0]===cur)) sel.value=cur; }
function fillFilters(){
  const regions=[...new Set(PROVINCES.map(p=>p.region))].sort((a,b)=>a.localeCompare(b));
  fill(el("fRegion"),regions.map(r=>[r,r]),t("allRegions"));
  const stages=[...new Set(ROWS.map(r=>r.stage))];
  fill(el("fStage"),stages.map(s=>[s,stageLabel(s)]),t("allStages"));
  fill(el("fStatus"),STATUS.map(s=>[s.k,t(s.lk)]),t("allStatuses"));
  fillProvinces();
}
function fillProvinces(){
  const r=el("fRegion").value;
  fill(el("fProvince"),PROVINCES.filter(p=>!r||p.region===r).map(p=>[p.name,p.name]),t("allProvinces"));
}
el("fRegion").onchange=()=>{fillProvinces();render();};
["fProvince","fStage","fStatus"].forEach(id=>el(id).onchange=render);
el("reset").onclick=()=>{["fRegion","fProvince","fStage","fStatus"].forEach(id=>el(id).value="");fillProvinces();render();};

function current(){
  const r=el("fRegion").value,p=el("fProvince").value,s=el("fStage").value,st=el("fStatus").value;
  const provs=PROVINCES.filter(x=>(!r||x.region===r)&&(!p||x.name===p));
  const names=new Set(provs.map(x=>x.name));
  const rows=ROWS.filter(x=>names.has(x.province)&&(!s||x.stage===s)&&(!st||x.status===st));
  return {provs,rows};
}

// ---------- tooltip ----------
const tip=el("tip");
function showTip(e,html){tip.innerHTML=html;tip.style.display="block";moveTip(e);}
function moveTip(e){const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=x+"px";tip.style.top=y+"px";}
function hideTip(){tip.style.display="none";}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill=s=>`<span class="pill ${S[s].cls}"><span aria-hidden="true">${S[s].icon}</span>${t(S[s].lk)}</span>`;

// ---------- KPIs ----------
function kpis(rows,provs){
  const c=k=>rows.filter(r=>r.status===k).length;
  const next90=rows.filter(r=>r.status!=="Done"&&r.due>=asof&&(r.due-asof)/DAY<=90).length;
  const p=rows.length?Math.round(c("Done")/rows.length*100):0;
  el("kpis").innerHTML=[
    [t("kProv"),provs.length,t("kProvS")(new Set(provs.map(p=>p.region)).size)],
    [t("kMil"),rows.length,t("kMilS")],
    [t("kDone"),c("Done"),t("kDoneS")(p)],
    [t("kLate"),c("Late"),t("kLateS"),true],
    [t("k90"),next90,t("k90S")]
  ].map(([l,v,s,late])=>`<div class="kpi${late?" late":""}"><div class="v">${v}</div><div class="l">${l}</div><div class="s">${s}</div></div>`).join("");
}

// ---------- timeline ----------
const NS="http://www.w3.org/2000/svg";
function svgEl(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n;}

function timeline(provs,rows){
  const box=el("timeline");box.innerHTML="";
  if(!provs.length||!rows.length){box.innerHTML=`<p class="sub">${t("none")}</p>`;return;}
  const W=Math.max(box.clientWidth,700), L=130, R=20, T0=28, rowH=34;
  const H=T0+provs.length*rowH+30;
  const t0=new Date("2026-01-01"), t1=new Date("2029-10-01");
  const x=d=>L+(d-t0)/(t1-t0)*(W-L-R);
  const svg=svgEl("svg",{width:W,height:H,role:"img","aria-label":t("ariaTimeline")},box);
  for(let y=2026;y<=2029;y++)for(let q=0;q<4;q++){
    const d=new Date(y,q*3,1); if(d>t1)break; const xx=x(d);
    svgEl("line",{x1:xx,x2:xx,y1:T0-6,y2:H-26,stroke:q?"#EBEDEE":"#D5D8DD","stroke-width":1},svg);
    if(!q){const tx=svgEl("text",{x:xx+4,y:14,"font-size":12,fill:"#6B7385"},svg);tx.textContent=y;}
  }
  provs.forEach((p,i)=>{
    const cy=T0+i*rowH+rowH/2;
    if(i%2===0) svg.insertBefore(svgEl("rect",{x:0,y:T0+i*rowH,width:W,height:rowH,fill:"#F6F7F8"}),svg.firstChild);
    const lab=svgEl("text",{x:L-10,y:cy+4,"text-anchor":"end","font-size":13,fill:"#464F60"},svg);lab.textContent=p.name;
    const pr=rows.filter(r=>r.province===p.name);
    if(pr.length){const a=Math.min(...pr.map(r=>r.due)),b=Math.max(...pr.map(r=>r.due));
      svgEl("line",{x1:x(a),x2:x(b),y1:cy,y2:cy,stroke:"#BFC4CB","stroke-width":2},svg);}
    pr.filter(r=>r.id!==12).forEach(r=>{
      const s=S[r.status];
      const g=svgEl("g",{style:"cursor:default"},svg);
      svgEl("circle",{cx:x(r.due),cy,r:12,fill:"transparent"},g);
      if(r.status==="Not started") svgEl("circle",{cx:x(r.due),cy,r:5,fill:"#fff",stroke:s.hex,"stroke-width":2},g);
      else svgEl("circle",{cx:x(r.due),cy,r:6,fill:s.hex,stroke:"#fff","stroke-width":2},g);
      g.addEventListener("mousemove",e=>showTip(e,`<b>${esc(msName(r))}</b><span class="m">${r.province} · ${stageLabel(r.stage)}</span><br>${t("tipDue")(fmt(r.due),r.offset)}<br>${pill(r.status)}${r.actual?`<br>${t("tipDone")(fmt(r.actual))}`:""}${r.notes?`<br><span class="m">${esc(r.notes)}</span>`:""}`));
      g.addEventListener("mouseleave",hideTip);
    });
    const dr=pr.find(r=>r.id===12);
    if(dr){const dx=x(dr.due);const g=svgEl("g",{},svg);
      svgEl("circle",{cx:dx,cy,r:12,fill:"transparent"},g);
      svgEl("path",{d:`M${dx} ${cy-8} L${dx+8} ${cy} L${dx} ${cy+8} L${dx-8} ${cy}Z`,fill:"#464F60",stroke:"#fff","stroke-width":2},g);
      g.addEventListener("mousemove",e=>showTip(e,`<b>${t("tipDist")(p.name)}</b>${t("tipPlanned")(fmt(dr.due))}<br>${p.interval?t("tipInterval")(p.interval)+"<br>":""}${pill(dr.status)}${dr.notes?`<br><span class="m">${esc(dr.notes)}</span>`:""}`));
      g.addEventListener("mouseleave",hideTip);}
  });
  const ax=x(asof);
  svgEl("line",{x1:ax,x2:ax,y1:T0-6,y2:H-22,stroke:"#F65050","stroke-width":2},svg);
  const at=svgEl("text",{x:ax,y:H-6,"text-anchor":"middle","font-size":11,fill:"#464F60"},svg);at.textContent=t("axisAsof")(fmt(asof));
}

// ---------- status bars ----------
function bars(provs,rows){
  const box=el("bars");box.innerHTML="";
  if(!provs.length||!rows.length){box.innerHTML=`<p class="sub">${t("none")}</p>`;return;}
  const W=Math.max(box.clientWidth,600),L=130,R=40,rowH=26,T0=6;
  const H=T0+provs.length*rowH+24;
  const max=Math.max(...provs.map(p=>rows.filter(r=>r.province===p.name).length),1);
  const x=n=>n/max*(W-L-R);
  const svg=svgEl("svg",{width:W,height:H,role:"img","aria-label":t("ariaBars")},box);
  for(let v=0;v<=max;v+=Math.max(1,Math.ceil(max/5))){const xx=L+x(v);
    svgEl("line",{x1:xx,x2:xx,y1:T0,y2:H-20,stroke:"#EBEDEE"},svg);
    const tt=svgEl("text",{x:xx,y:H-6,"text-anchor":"middle","font-size":11,fill:"#6B7385"},svg);tt.textContent=v;}
  provs.forEach((p,i)=>{
    const y=T0+i*rowH+5,h=rowH-10;
    const lab=svgEl("text",{x:L-10,y:y+h/2+4,"text-anchor":"end","font-size":13,fill:"#464F60"},svg);lab.textContent=p.name;
    let acc=0; const pr=rows.filter(r=>r.province===p.name);
    STATUS.forEach(s=>{const n=pr.filter(r=>r.status===s.k).length;if(!n)return;
      const g=svgEl("g",{},svg);
      const w=Math.max(x(n)-2,1);
      if(s.k==="Not started") svgEl("rect",{x:L+x(acc)+1,y:y+1,width:Math.max(w-2,1),height:h-2,fill:"#fff",stroke:s.hex,"stroke-width":1.5},g);
      else svgEl("rect",{x:L+x(acc),y,width:w,height:h,fill:s.hex},g);
      g.addEventListener("mousemove",e=>showTip(e,`<b>${p.name}</b>${pill(s.k)} ${t("nMil")(n)}`));
      g.addEventListener("mouseleave",hideTip);
      acc+=n;});
    const tt=svgEl("text",{x:L+x(acc)+6,y:y+h/2+4,"font-size":12,fill:"#464F60"},svg);tt.textContent=pr.length;
  });
}

// ---------- context cards ----------
function ctx(provs){
  el("ctx").innerHTML=provs.filter(p=>p.dist&&p.last).map(p=>`<div class="card"><h3>${p.name}</h3><div class="r">${t("cRegion")(p.region,fmt(new Date(p.dist+"T00:00:00")))}</div>
  <dl><dt>${t("cLast")}</dt><dd>${fmt(new Date(p.last+"T00:00:00"))}</dd>
  <dt>${t("cInterval")}</dt><dd>${t("cIntervalV")(p.interval,p.cycle)}</dd>
  <dt>${t("cOwn")}</dt><dd>${pct(p.owner)} / ${pct(p.access)}</dd>
  <dt>${t("cUse")}</dt><dd>${pct(p.use)}</dd>
  <dt>${t("cRdt")}</dt><dd>≈ ${pct(p.rdt)}</dd>
  <dt>${t("cAssess")}</dt><dd>${p.assess[LANG]}</dd></dl></div>`).join("");
}

// ---------- table ----------
const COLS=["province","region","stage","milestone","due","days","status","actual","notes","doneWhen"];
let sortKey="due",sortDir=1;
function table(rows){
  const thead=el("tbl").tHead, L=t("cols");
  thead.innerHTML="<tr>"+COLS.map(k=>`<th data-k="${k}" ${k===sortKey?`aria-sort="${sortDir>0?"ascending":"descending"}"`:""}>${L[k]}</th>`).join("")+"</tr>";
  thead.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k===sortKey)sortDir*=-1;else{sortKey=k;sortDir=1;}render();});
  const val=(r,k)=>k==="days"?(r.due-asof):k==="due"?r.due.getTime():k==="actual"?(r.actual?r.actual.getTime():0):
    k==="milestone"?msName(r):k==="stage"?stageLabel(r.stage):k==="doneWhen"?msDone(r):k==="status"?t(S[r.status].lk):r[k];
  const sorted=[...rows].sort((a,b)=>{const A=val(a,sortKey),B=val(b,sortKey);return (typeof A==="string"?A.localeCompare(B,loc()):(A<B?-1:A>B?1:0))*sortDir||a.due-b.due;});
  el("tbl").tBodies[0].innerHTML=sorted.map(r=>{const d=Math.round((r.due-asof)/DAY);
    return `<tr><td>${r.province}</td><td>${r.region}</td><td>${stageLabel(r.stage)}</td><td>${esc(msName(r))}</td><td class="num">${fmt(r.due)}</td><td class="num">${d>0?"+":""}${d}</td><td>${pill(r.status)}</td><td class="num">${r.actual?fmt(r.actual):""}</td><td>${esc(r.notes||"")}</td><td>${msDone(r)}</td></tr>`;}).join("");
  el("tableCount").textContent=t("count")(rows.length);
}

function render(){const {provs,rows}=current();kpis(rows,provs);timeline(provs,rows);bars(provs,rows);ctx(provs);table(rows);}

// ---------- language switch ----------
function setLang(l){
  if(l===LANG) return; LANG=l;
  try{ localStorage.setItem("macepa-dash-lang",l); }catch(e){}
  try{ const u=new URL(location.href); u.searchParams.set("lang",l); history.replaceState(null,"",u); }catch(e){}
  applyStatic(); fillFilters(); render();
}
document.querySelectorAll(".langswitch button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

(async function init(){
  try{
    const res=await fetch(DATA_FILE,{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const lm=res.headers.get("Last-Modified"); if(lm) META=new Date(lm);
    ROWS=rowsFromCSV(await res.text()); SOURCE="sheet";
  }catch(e){ buildDemo(); SOURCE="demo"; }
  applyStatic(); fillFilters(); render();
})();
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(render,150);});
</script>
